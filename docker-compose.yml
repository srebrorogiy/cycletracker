version: '3.8'

services:
  web:
    build: .
    restart: always
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/tracker.db
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"

  bot:
    build: .
    restart: always
    command: python bot.py
    env_file:
      - .env
    depends_on:
      - web
